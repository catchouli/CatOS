// catos: open browser windows in full screen, like pressing F11.
// The toolbar stays hidden but slides down when the mouse touches the top of
// the screen. Only profiles that set catos.fullscreen (see catos-browser).
Services.obs.addObserver(function (win) {
  if (Services.prefs.getBoolPref("catos.fullscreen", false)) {
    win.fullScreen = true;
  }
}, "browser-delayed-startup-finished");
