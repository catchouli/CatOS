# NVIDIA's driver: kernel mode setting, which Wayland compositors like cage need
# (off by default in the 550 driver). Debian renames the modules nvidia-current-*;
# the plain name is there too in case that ever changes.
options nvidia-current-drm modeset=1 fbdev=1
options nvidia-drm modeset=1 fbdev=1

# Keep nouveau off NVIDIA cards so NVIDIA's driver gets them. The NVIDIA package
# does this too, but through a symlink that doesn't make it into the initramfs,
# where nouveau would otherwise load first.
blacklist nouveau
options nouveau modeset=0
