[package]
name = "meownix-menu"
version = "0.1.0"
edition = "2024"
description = "Crossbar launcher for the meownix TV box"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2.190"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[profile.release]
lto = "thin"
strip = true
