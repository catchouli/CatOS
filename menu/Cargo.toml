[package]
name = "catos-menu"
version = "0.1.0"
edition = "2024"
description = "Crossbar launcher for the catos TV box"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2.190"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
strip = true
