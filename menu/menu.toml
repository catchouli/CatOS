# meownix menu. Installed as /etc/meownix/menu.toml; a copy in
# ~/.config/meownix/menu.toml overrides it.
#
# Icons: tv, gear, sliders, speaker, play, youtube, film, power, restart, network

[controls]
# Linux key names (run `evtest` on the box to see what the remote sends).
# These close the open app and return to the menu.
home_keys = ["KEY_HOMEPAGE"]
# These do the same when held down for hold_seconds.
hold_keys = ["KEY_BACK", "KEY_ESC"]
hold_seconds = 1.0

[display]
# How much to enlarge apps on a 1080p screen, so they're readable from the
# couch. It's adjusted for the real resolution, so apps look the same size on
# any screen. An app can set its own `scale` to override it.
scale = 1.75
# Screen mode to use, if the screen offers it: "1920x1080", "1920x1080@60", or
# "auto" for the screen's own preferred mode. 1080p is what the menu and apps
# are designed for, and the easiest for the box's GPU (and for some drivers:
# nouveau can't do 4K over DisplayPort on some cards). A mode picked in
# Settings → Resolution takes its place.
mode = "1920x1080"

[avatar]
# A Live2D model to show beside the menu: its .model3.json, or a folder with
# one in it. build.sh puts cache/avatar/ here. Needs a build with Live2D's SDK
# (see build.sh); otherwise, or if there's no model, there's no avatar.
model = "/usr/share/meownix/avatar"

[[category]]
name = "Watch"
icon = "tv"

  [[category.item]]
  name = "Flex"
  icon = "film"
  description = "Our media library"
  command = ["/opt/flex/flex"]

  [[category.item]]
  name = "Flex (web)"
  icon = "film"
  description = "Flex on another PC, in the browser"
  command = ["meownix-browser", "flex", "http://192.168.1.110:8484"]

  [[category.item]]
  name = "FreeTube"
  icon = "play"
  description = "YouTube without the ads or tracking"
  command = ["meownix-freetube"]

  [[category.item]]
  name = "YouTube"
  icon = "youtube"
  description = "YouTube's TV interface in Firefox"
  command = [
    "meownix-browser", "youtube", "https://www.youtube.com/tv",
    # Pretend to be a Samsung TV so YouTube serves its TV interface.
    "Mozilla/5.0 (SMART-TV; LINUX; Tizen 6.5) AppleWebKit/537.36 (KHTML, like Gecko) 85.0.4183.93/6.5 TV Safari/537.36",
  ]

[[category]]
name = "Settings"
icon = "sliders"

  [[category.item]]
  name = "Sound"
  icon = "speaker"
  action = "sound"

  [[category.item]]
  name = "Resolution"
  icon = "tv"
  action = "resolution"

  [[category.item]]
  name = "Wi-Fi"
  icon = "network"
  action = "wifi"

[[category]]
name = "System"
icon = "gear"

  [[category.item]]
  name = "Network"
  icon = "network"
  action = "network"

  [[category.item]]
  name = "Restart"
  icon = "restart"
  description = "Restart the TV box"
  action = "reboot"

  [[category.item]]
  name = "Shut down"
  icon = "power"
  description = "Turn the TV box off"
  action = "poweroff"
